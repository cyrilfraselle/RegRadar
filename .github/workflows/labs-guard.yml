name: guard

# Confines agent pull requests to their own paths (see tests/guard.py) and
# syntax-checks changed JS/JSON. The guard script is read from main, so a
# pull request cannot weaken it for itself.
on:
  pull_request:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Path guard (script taken from main)
        run: |
          git show "origin/${BASE_REF}:tests/guard.py" > "$RUNNER_TEMP/guard.py" 2>/dev/null || cp tests/guard.py "$RUNNER_TEMP/guard.py"
          python3 "$RUNNER_TEMP/guard.py" "$BASE_REF" "$HEAD_REF"

      - name: Syntax checks on changed files
        run: |
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          for f in $(printf '%s\n' "$changed" | grep -E '\.js$' || true); do
            [ -f "$f" ] && node --check "$f"
          done
          for f in $(printf '%s\n' "$changed" | grep -E '\.json$' || true); do
            [ -f "$f" ] && python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
          echo "ok"
