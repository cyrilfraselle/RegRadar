<!DOCTYPE html>
<html lang="en" data-no-glossary>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AML/KYC Glossary — RegRadar Academy</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="glossary.js"></script>
<style>
:root{
  --void:#FAFAFA; --console:#FFFFFF; --raised:#F4F5F6; --grid:#E3E5E8;
  --ink:#0A0A0A; --ink-2:#5B6069; --ink-3:#6B7079;
  --phos:#0F7B4F; --amber:#9A6B00; --alarm:#C8320F; --ice:#0039A6; --violet:#6E3FBF;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:48px 24px 90px}
.kick{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--ink-2)}
h1{font-size:clamp(26px,4vw,38px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.sub{font-size:15px;color:var(--ink-2);margin-top:12px;max-width:60ch}
.back{display:inline-flex;align-items:center;min-height:44px;margin-top:8px;font-size:14px;color:var(--ice);
  text-decoration:underline;text-decoration-color:var(--grid);text-underline-offset:4px}
.back:hover{text-decoration-color:var(--ice)}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:26px}
.jump a{display:inline-flex;align-items:center;min-height:44px;font-size:13px;font-weight:600;color:var(--ink-2);
  text-decoration:none;border:1px solid var(--grid);background:var(--console);padding:0 12px;border-radius:6px}
.jump a:hover,.jump a:focus-visible{border-color:var(--ice);color:var(--ice)}
.jump a:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.list{margin-top:30px;border-top:1px solid var(--grid)}
.term{padding:22px 0;border-bottom:1px solid var(--grid);scroll-margin-top:20px}
.term:target{background:#E3ECFB;margin:0 -16px;padding:22px 16px 22px 12px;border-radius:6px;
  border-left:4px solid var(--ice);box-shadow:0 0 0 1px rgba(0,57,166,.25)}
.term h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.term p{font-size:15px;color:var(--ink-2);margin-top:8px;max-width:62ch}
</style>
</head>
<body>
<script src="site-nav.js"></script>
<main class="wrap" id="main">
  <div class="kick">REGRADAR ACADEMY</div>
  <h1>AML/KYC Glossary</h1>
  <p class="sub">The technical terms used across every case, chart, and file in the Academy —
    plain-English definitions, no textbook required. Inside a case, a term with a dotted underline
    opens a short definition and links back to its entry here.</p>
  <a class="back" href="academy.html">← Back to the Academy</a>

  <nav class="jump" id="jump" aria-label="Jump to a term"></nav>
  <div class="list" id="list"></div>
</main>
<script>
/* Display name: "PEP — Politically Exposed Person" -> "Politically Exposed Person (PEP)";
   terms without an acronym keep their name. One format, one alphabetical order. */
function esc(x){ return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function display(t){
  const i = t.t.indexOf(' \u2014 ');
  return i < 0 ? t.t : t.t.slice(i + 3) + ' (' + t.t.slice(0, i) + ')';
}
const terms = Glossary.terms.map(t=>({id:t.id, name:display(t), d:t.d}))
  .sort((a,b)=>a.name.localeCompare(b.name, 'en', {sensitivity:'base'}));
document.getElementById('jump').innerHTML = terms.map(t=>`<a href="#${t.id}">${esc(t.name)}</a>`).join('');
document.getElementById('list').innerHTML = terms.map(t=>`
  <section class="term" id="${t.id}">
    <h2>${esc(t.name)}</h2>
    <p>${esc(t.d)}</p>
  </section>`).join('');
</script>
</body>
</html>
