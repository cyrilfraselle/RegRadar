<!DOCTYPE html>
<html lang="en" data-no-glossary data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RegRadar: Glossary</title>
<meta name="description" content="Plain-language glossary of AML and KYC terms from RegRadar Academy.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>
(function(){try{var t=localStorage.getItem('regradar-theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
window.toggleTheme=function(){var h=document.documentElement,t=h.dataset.theme==='dark'?'light':'dark';h.dataset.theme=t;try{localStorage.setItem('regradar-theme',t)}catch(e){}};
</script>
<link rel="stylesheet" href="rr-ui.css?v=20261114a">
<script src="glossary.js?v=20261015"></script>
<style>
:root,html[data-theme]{
  /* Academy token contract (glossary.css tooltips) mapped to rr-ui */
  --void:var(--rr-bg); --console:var(--rr-surface); --raised:var(--rr-surface-2); --grid:var(--rr-line);
  --ink:var(--rr-text); --ink-2:var(--rr-text-2); --ink-3:var(--rr-text-3);
  --phos:var(--rr-done); --amber:var(--rr-review); --alarm:var(--rr-risk); --ice:var(--rr-accent); --violet:#6E3FBF;
  --sans:var(--rr-font);
}
.wrap{max-width:820px}
.back{display:inline-flex;align-items:center;min-height:44px;margin-top:8px;font-size:14px;color:var(--ice);
  text-decoration:underline;text-decoration-color:var(--grid);text-underline-offset:4px}
.back:hover{text-decoration-color:var(--ice)}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:26px}
.jump a{display:inline-flex;align-items:center;min-height:44px;font-size:13px;font-weight:600;color:var(--ink-2);
  text-decoration:none;border:1px solid var(--grid);background:var(--console);padding:0 14px;border-radius:999px}
.jump a:hover,.jump a:focus-visible{border-color:var(--ice);color:var(--ice)}
.jump a:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.list{margin-top:30px;border-top:1px solid var(--grid)}
.term{padding:22px 0;border-bottom:1px solid var(--grid);scroll-margin-top:20px}
.term:target{background:var(--rr-accent-bg);margin:0 -16px;padding:22px 16px;border-radius:var(--rr-r);box-shadow:0 0 0 1px var(--rr-accent)}
.term h2{font-size:var(--rr-t-h3);font-weight:700;letter-spacing:-.01em}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.term p{font-size:15px;color:var(--ink-2);margin-top:8px;max-width:62ch}
</style>
</head>
<body>
<script src="site-nav.js?v=20261114a"></script>
<main class="wrap" id="main">
  <header class="head rr-band">
    <div>
      <h1>Glossary</h1>
      <p class="lead">The AML and KYC terms used across the Academy and Max, in plain English. Inside a case, a term with a dotted underline opens its definition.</p>
    </div>
    <div class="head-tools"><a class="btn" href="academy.html">Back to the AMLR path</a></div>
  </header>

  <nav class="jump" id="jump" aria-label="Jump to a term"></nav>
  <div class="list" id="list"></div>
</main>
<script>
/* Display name: "PEP — Politically Exposed Person" -> "Politically Exposed Person (PEP)";
   terms without an acronym keep their name. One format, one alphabetical order. */
function esc(x){ return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function display(t){
  const i = t.t.indexOf(' \u2014 ');
  return i < 0 ? t.t : t.t.slice(i + 3) + ' (' + t.t.slice(0, i) + ')';
}
const terms = Glossary.terms.map(t=>({id:t.id, name:display(t), d:t.d}))
  .sort((a,b)=>a.name.localeCompare(b.name, 'en', {sensitivity:'base'}));
document.getElementById('jump').innerHTML = terms.map(t=>`<a href="#${t.id}">${esc(t.name)}</a>`).join('');
document.getElementById('list').innerHTML = terms.map(t=>`
  <section class="term" id="${t.id}">
    <h2>${esc(t.name)}</h2>
    <p>${esc(t.d)}</p>
  </section>`).join('');
</script>
</body>
</html>
