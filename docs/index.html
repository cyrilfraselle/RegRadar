<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RegRadar — Signal</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>
(function(){try{var t=localStorage.getItem('regradar-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<style>
  :root{
    --bg:#FAFAFA; --surface:#FFFFFF; --surface-2:#F4F5F6; --border:#E3E5E8; --border-strong:#0A0A0A;
    --text:#0A0A0A; --text-2:#5B6069; --text-3:#8B9099;
    --accent:#0039A6;
    --crit:#C8320F; --imp:#9A6B00; --ok:#0F7B4F; --info:#0039A6;
    --grid-line:rgba(10,10,10,.10); --sweep:rgba(0,57,166,.18);
    --font:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,"IBM Plex Mono",Menlo,Consolas,monospace;
    --ease:cubic-bezier(.2,0,0,1);
  }
  html[data-theme="dark"]{
    --bg:#08090B; --surface:#0E1013; --surface-2:#14171B; --border:#20242A; --border-strong:#F2F2F2;
    --text:#F2F4F6; --text-2:#98A0AA; --text-3:#666E78;
    --accent:#4D8DFF;
    --crit:#FF5C3D; --imp:#FFB93D; --ok:#2DD48F; --info:#4D8DFF;
    --grid-line:rgba(77,141,255,.16); --sweep:rgba(77,141,255,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;
    letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--accent);color:#fff}
  .wrap{max-width:1280px;margin:0 auto;padding:0 24px}

  .topbar{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:2px solid var(--border-strong)}
  .topbar-inner{display:flex;align-items:center;gap:20px;height:60px;max-width:1280px;margin:0 auto;padding:0 24px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em}
  .logo-mark{width:30px;height:30px;background:var(--accent);color:#fff;display:flex;align-items:center;
    justify-content:center;font-weight:700;font-size:17px}
  .logo-sub{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.10em;font-weight:500}
  .nav{display:flex;margin-left:16px}
  .nav a{padding:8px 14px;font-size:13px;font-weight:500;color:var(--text-2);
    border-bottom:2px solid transparent;margin-bottom:-2px;transition:color 140ms var(--ease),border-color 140ms var(--ease)}
  .nav a:hover:not(.active){color:var(--text)}
  .nav a.active{color:var(--text);font-weight:700;border-bottom-color:var(--accent)}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .kbd{font-family:var(--mono);font-size:11px;color:var(--text-3);border:1px solid var(--border);
    padding:4px 8px;cursor:pointer;transition:border-color 140ms var(--ease),color 140ms var(--ease)}
  .kbd:hover{border-color:var(--accent);color:var(--accent)}
  .icon-btn{width:32px;height:32px;border:1px solid var(--border);background:transparent;color:var(--text-2);
    cursor:pointer;font-size:15px;transition:border-color 140ms var(--ease),color 140ms var(--ease)}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent)}

  .console{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:44px;padding:36px 0 30px;align-items:start}
  @media(max-width:940px){.console{grid-template-columns:1fr;gap:28px}}

  .scope svg{display:block;width:100%;height:auto}
  .scope-cap{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;
    border-top:1px solid var(--border);padding-top:9px}
  .scope-cap span{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
  .scope-cap .live{color:var(--ok);display:flex;align-items:center;gap:6px}
  .scope-cap .live i{width:6px;height:6px;background:var(--ok);display:block;animation:blink 2.4s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

  .readout .eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
  .readout h1{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-top:12px}
  .readout .stamp{font-family:var(--mono);font-size:12px;color:var(--text-3);margin-top:10px}

  .gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);
    border-top:2px solid var(--border-strong);border-bottom:1px solid var(--border);margin:22px 0}
  .gauge{background:var(--bg);padding:14px 0 12px}
  .gauge .n{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .gauge .l{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.09em;font-weight:700;margin-top:7px}
  .gauge.crit .n{color:var(--crit)} .gauge.imp .n{color:var(--imp)}

  .brief{border-left:2px solid var(--accent);padding:2px 0 2px 16px}
  .brief .bl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);margin-bottom:7px}
  .brief p{font-size:14px;line-height:1.6;color:var(--text-2);max-width:62ch}
  .brief button{margin-top:12px;background:transparent;border:1px solid var(--border);color:var(--text-2);
    font-family:var(--font);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
    padding:7px 12px;cursor:pointer;transition:border-color 140ms var(--ease),color 140ms var(--ease)}
  .brief button:hover{border-color:var(--accent);color:var(--accent)}

  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:2px solid var(--border-strong);
    padding:14px 0;margin-top:8px}
  .bar .bl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);margin-right:4px}
  .fchip{font-size:12px;font-weight:600;padding:5px 11px;border:1px solid var(--border);color:var(--text-2);
    cursor:pointer;transition:all 140ms var(--ease);white-space:nowrap}
  .fchip:hover{border-color:var(--text-3);color:var(--text)}
  .fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .fcount{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}

  .feed{border-top:1px solid var(--border)}
  .sig{display:grid;grid-template-columns:16px 76px 46px 1fr auto;gap:16px;align-items:baseline;
    padding:15px 0;border-bottom:1px solid var(--border);cursor:pointer;
    transition:background 140ms var(--ease)}
  .sig:hover{background:var(--surface-2)}
  .sig:hover .arrow{opacity:1;transform:translateX(0)}
  .sig .lamp{width:8px;height:8px;position:relative;top:5px}
  .sig .src{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text-2);
    text-transform:uppercase;position:relative;top:1px}
  .sig .age{font-family:var(--mono);font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums;position:relative;top:1px}
  .sig .body h3{font-size:15px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
  .sig .body p{font-size:13px;color:var(--text-2);line-height:1.5;margin-top:5px;max-width:76ch}
  .sig .meta{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .tg{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;
    border:1px solid var(--border);color:var(--text-3)}
  .tg.due{border-color:var(--crit);color:var(--crit)}
  .arrow{font-family:var(--mono);color:var(--accent);opacity:0;transform:translateX(-4px);
    transition:all 140ms var(--ease);position:relative;top:2px}
  .empty{padding:44px 0;text-align:center;color:var(--text-3);font-size:14px}

  .ov{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity 160ms;z-index:100}
  .ov.on{opacity:1;pointer-events:auto}
  .dw{position:fixed;top:0;right:0;height:100%;width:min(580px,94vw);background:var(--bg);
    border-left:2px solid var(--border-strong);transform:translateX(100%);transition:transform 200ms var(--ease);
    z-index:101;overflow-y:auto}
  .dw.on{transform:none}
  .dw-in{padding:26px 28px 70px;position:relative}
  .dw .x{position:absolute;top:16px;right:18px;font-size:22px;color:var(--text-3);cursor:pointer;background:none;border:none}
  .dw h2{font-size:22px;font-weight:700;letter-spacing:-.025em;line-height:1.2;margin:8px 0 12px;padding-right:34px}
  .dsec{margin-top:20px;border-top:1px solid var(--border);padding-top:12px}
  .dsec .dl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);margin-bottom:8px}
  .dsec p{font-size:14px;line-height:1.6;color:var(--text-2)}
  .dsec.act{border-top:2px solid var(--accent)}
  .dsec.act p{color:var(--text)}
  .dlink{display:inline-block;margin-top:20px;font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:.08em;color:var(--accent);border-bottom:2px solid var(--accent);padding-bottom:2px}

  .cmd{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:120;padding-top:14vh}
  .cmd.on{display:block}
  .cmd-box{max-width:600px;margin:0 auto;background:var(--surface);border:2px solid var(--border-strong)}
  .cmd input{width:100%;padding:16px 18px;border:none;border-bottom:1px solid var(--border);
    background:transparent;color:var(--text);font-size:16px;font-family:var(--font);outline:none}
  .cmd-res{max-height:50vh;overflow-y:auto}
  .cmd-res div{padding:11px 18px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--border);color:var(--text-2)}
  .cmd-res div:hover,.cmd-res div.sel{background:var(--accent);color:#fff}

  footer{border-top:2px solid var(--border-strong);margin-top:34px;padding:20px 0 50px;
    font-size:10px;color:var(--text-3);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
    text-transform:uppercase;letter-spacing:.08em;font-weight:700}

  @keyframes pulse{0%,90%{opacity:.5}95%{opacity:1}100%{opacity:.5}}
  @keyframes rotate{to{transform:rotate(360deg)}}
  #sweep{animation:rotate 8s linear infinite;transform-origin:200px 200px}
  .blip{animation:pulse 8s linear infinite}

  @media(prefers-reduced-motion:reduce){
    #sweep,.blip,.live i{animation:none!important}
    *,*::before,*::after{transition-duration:.01ms!important}
  }
  @media(max-width:720px){
    .readout h1{font-size:26px}
    .gauges{grid-template-columns:repeat(2,1fr)}
    .sig{grid-template-columns:14px 1fr;gap:10px}
    .sig .src,.sig .age,.arrow{display:none}
    .nav{overflow-x:auto;margin-left:0} .logo-sub{display:none}
  }
</style>
</head>
<body>

<div class="topbar"><div class="topbar-inner">
  <div class="logo"><span class="logo-mark">R</span>RegRadar<span class="logo-sub">Belgium &amp; EU</span></div>

    <nav class="nav">
    <a href="index.html" class="active">Signal</a>
    <a href="law.html">Read the Law</a>
    <a href="country-risk.html">Country Risk</a>
    <a href="obligations.html">Obligations</a>
    <a href="extractor.html">Extractor</a>
    <a href="ubo.html">UBO</a>
    <a href="academy.html">Academy</a>
  </nav>

  <div class="topbar-right">
    <span class="kbd" onclick="openCmd()">⌘K</span>
    <a class="icon-btn" href="identity.html" title="Design system" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-size:10px;font-weight:700">DS</a>
    <button class="icon-btn" onclick="toggleTheme()" title="Theme">◐</button>
  </div>
</div></div>

<div class="wrap">

  <section class="console">
    <div class="scope">
      <svg viewBox="0 0 400 400" role="img"
           aria-label="Signal scope. Bearing shows the regulatory sector, distance from centre shows how recent the signal is.">
        <defs>
          <radialGradient id="sweepGrad">
            <stop offset="0%" stop-color="var(--sweep)" stop-opacity="0"/>
            <stop offset="100%" stop-color="var(--sweep)" stop-opacity="1"/>
          </radialGradient>
          <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
            <feGaussianBlur stdDeviation="2.6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <g fill="none" stroke="var(--grid-line)" stroke-width="1">
          <circle cx="200" cy="200" r="46"/><circle cx="200" cy="200" r="92"/>
          <circle cx="200" cy="200" r="138"/><circle cx="200" cy="200" r="184"/>
        </g>
        <g stroke="var(--grid-line)" stroke-width="1" id="spokes"></g>

        <g id="sweep">
          <path d="M200,200 L200,16 A184,184 0 0,1 291,41 Z" fill="url(#sweepGrad)"/>
          <line x1="200" y1="200" x2="200" y2="16" stroke="var(--accent)" stroke-width="1.5" opacity=".75"/>
        </g>

        <g id="rangeLabels" font-family="SF Mono, ui-monospace, Menlo, monospace" font-size="8"
           fill="var(--text-3)" letter-spacing="1"></g>
        <circle cx="200" cy="200" r="2.5" fill="var(--accent)"/>
        <g id="blips"></g>
        <g id="sectorLabels" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
           font-size="8.5" font-weight="700" fill="var(--text-3)" letter-spacing="1.2" text-anchor="middle"></g>
      </svg>
      <div class="scope-cap">
        <span class="live"><i></i> Sweeping</span>
        <span id="rangeSet">—</span>
        <span id="scopeMeta">—</span>
      </div>
    </div>

    <div class="readout">
      <div class="eyebrow">Regulatory signal · Belgium &amp; EU</div>
      <h1 id="headline">Reading the sweep…</h1>
      <div class="stamp" id="stamp">—</div>

      <div class="gauges">
        <div class="gauge crit"><div class="n" id="gCrit">0</div><div class="l">Critical</div></div>
        <div class="gauge imp"><div class="n" id="gImp">0</div><div class="l">Important</div></div>
        <div class="gauge"><div class="n" id="gTot">0</div><div class="l">Signals</div></div>
        <div class="gauge"><div class="n" id="gDue">0</div><div class="l">Deadlines</div></div>
      </div>

      <div class="brief">
        <div class="bl">The brief</div>
        <p id="briefText">—</p>
        <button onclick="copyBrief(event)">Copy briefing</button>
      </div>
    </div>
  </section>

  <div class="bar" id="filters"><span class="bl">Sector</span></div>
  <div class="feed" id="feed"></div>

  <footer>
    <span>RegRadar · automated regulatory watch</span>
    <span id="footStamp">—</span>
  </footer>
</div>

<div class="ov" id="ov" onclick="closeDrawer()"></div>
<div class="dw" id="dw"><div class="dw-in" id="dwBody"></div></div>

<div class="cmd" id="cmd" onclick="if(event.target.id==='cmd')closeCmd()">
  <div class="cmd-box">
    <input id="cmdIn" placeholder="Search signals, sources, sectors…" oninput="cmdSearch()" onkeydown="cmdKey(event)" autocomplete="off">
    <div class="cmd-res" id="cmdRes"></div>
  </div>
</div>

<script>
let ITEMS=[], META={}, ACTIVE=new Set(), SEL=0;

/* Bearing = regulatory sector. Distance = age. Both carry meaning. */
const SECTORS=[
  {key:'AML/CFT',                label:'AML',        a:-90},
  {key:'MiCA/Crypto',            label:'CRYPTO',     a:-30},
  {key:'Markets',                label:'MARKETS',    a:30},
  {key:'Capital',                label:'CAPITAL',    a:90},
  {key:'Payments',               label:'PAYMENTS',   a:150},
  {key:'Operational Resilience', label:'RESILIENCE', a:210}
];
const IMPACT={3:{c:'var(--crit)',n:'Critical'},2:{c:'var(--imp)',n:'Important'},1:{c:'var(--info)',n:'Info'}};

const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hoursAgo=d=>Math.max(0,(Date.now()-new Date(d).getTime())/36e5);
function ageLabel(h){ if(h<1)return'now'; if(h<24)return Math.round(h)+'h'; return Math.round(h/24)+'d'; }
function fmtDate(d){ try{return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return d||'';} }
function toggleTheme(){const h=document.documentElement;const t=h.dataset.theme==='dark'?'light':'dark';
  h.dataset.theme=t;try{localStorage.setItem('regradar-theme',t)}catch(e){}}

/* A sector is a wedge, not a line. Contacts in the same sector spread
   across it so several signals in one area stay countable. */
function assignBearings(list){
  const groups=new Map();
  list.forEach(it=>{
    const th=it.themes||[];
    const sec=SECTORS.find(s=>th.includes(s.key));
    let base;
    if(sec) base=sec.a;
    else { let h=0; for(const ch of (it.id||'x')) h=(h*31+ch.charCodeAt(0))%360; base=h-180; }
    if(!groups.has(base)) groups.set(base,[]);
    groups.get(base).push(it);
  });
  const out=new Map();
  groups.forEach((arr,base)=>{
    const n=arr.length, spanDeg=44;
    arr.forEach((it,i)=>{
      const off = n===1 ? 0 : (-spanDeg/2 + (i/(n-1))*spanDeg);
      out.set(it.id, base+off);
    });
  });
  return out;
}
/* Range scales, like a real scope. We pick the tightest one that still
   contains every contact, then label the rings honestly. */
const RANGES=[[6,24,168,720],[24,168,720,2160],[168,720,2160,8760]];
let BANDS=RANGES[0];
const RING=[46,92,138,184];

function hLabel(h){
  if(h<24) return h+'H';
  if(h<720) return Math.round(h/24)+'D';
  if(h<8760) return Math.round(h/720)+'M';
  return Math.round(h/8760)+'Y';
}
function pickRange(items){
  const max=Math.max(0,...items.map(i=>hoursAgo(i.date)));
  BANDS = RANGES.find(r=>r[3]>=max) || RANGES[RANGES.length-1];
  // relabel the rings
  const g=document.getElementById('rangeLabels');
  if(g) g.innerHTML=BANDS.map((h,i)=>
    `<text x="205" y="${(200-RING[i]+5).toFixed(0)}">${hLabel(h)}</text>`).join('');
  const rl=document.getElementById('rangeSet');
  if(rl) rl.textContent='Range '+hLabel(BANDS[3]);
}
function radiusOf(it){
  const h=hoursAgo(it.date);
  const lo=[0,...BANDS.slice(0,3)], hi=BANDS;
  let r=RING[3];
  for(let i=0;i<4;i++){
    if(h<=hi[i]){
      const prevR = i===0?20:RING[i-1];
      const span  = hi[i]-lo[i] || 1;
      r = prevR + ((h-lo[i])/span)*(RING[i]-prevR);
      break;
    }
  }
  /* Contacts picked up in the same sweep share a true range. Spread them
     a little so a cluster reads as several contacts, not one thick arc. */
  let s=0; for(const ch of (it.id||'x')) s=(s*31+ch.charCodeAt(0))%97;
  return Math.max(24, Math.min(184, r + ((s/97)-0.5)*34));
}

function drawScope(){
  let s='';
  SECTORS.forEach(sec=>{
    const r=(sec.a-30)*Math.PI/180;
    s+=`<line x1="200" y1="200" x2="${(200+190*Math.cos(r)).toFixed(1)}" y2="${(200+190*Math.sin(r)).toFixed(1)}"/>`;
  });
  document.getElementById('spokes').innerHTML=s;
  let l='';
  SECTORS.forEach(sec=>{
    const r=sec.a*Math.PI/180, R=196;
    l+=`<text x="${(200+R*Math.cos(r)).toFixed(1)}" y="${(200+R*Math.sin(r)+3).toFixed(1)}">${sec.label}</text>`;
  });
  document.getElementById('sectorLabels').innerHTML=l;
}

function drawBlips(list){
  let s=''; const BEAR=assignBearings(list);
  list.forEach((it,i)=>{
    const a=BEAR.get(it.id), rad=radiusOf(it), r=a*Math.PI/180;
    const x=(200+rad*Math.cos(r)).toFixed(1), y=(200+rad*Math.sin(r)).toFixed(1);
    const col=(IMPACT[it.impact]||IMPACT[1]).c;
    const size=it.impact===3?5:it.impact===2?4:3.2;
    const delay=((((a+90)%360)+360)%360)/360*8;      /* pulse when the sweep passes */
    s+=`<g class="blip" style="animation-delay:${delay.toFixed(2)}s" data-i="${i}">
          <circle cx="${x}" cy="${y}" r="${size+7}" fill="${col}" opacity=".07"/>
          <circle cx="${x}" cy="${y}" r="${size}" fill="${col}" filter="url(#glow)" style="cursor:pointer"/>
        </g>`;
  });
  const g=document.getElementById('blips');
  g.innerHTML=s;
  g.querySelectorAll('.blip').forEach(el=>el.addEventListener('click',()=>openDrawer(list[+el.dataset.i].id)));
}

function visible(){ return ACTIVE.size? ITEMS.filter(i=>(i.themes||[]).some(t=>ACTIVE.has(t))) : ITEMS; }

function buildFilters(){
  const themes=[...new Set(ITEMS.flatMap(i=>i.themes||[]))].sort();
  const bar=document.getElementById('filters');
  bar.querySelectorAll('.fchip,.fcount').forEach(e=>e.remove());
  themes.forEach(t=>{
    const b=document.createElement('span');
    b.className='fchip'; b.textContent=t;
    b.onclick=()=>{ACTIVE.has(t)?ACTIVE.delete(t):ACTIVE.add(t);render();};
    bar.appendChild(b);
  });
  const c=document.createElement('span'); c.className='fcount'; c.id='fcount'; bar.appendChild(c);
}

function sigRow(it){
  const im=IMPACT[it.impact]||IMPACT[1];
  const due=it.deadline?`<span class="tg due">Due ${fmtDate(it.deadline)}</span>`:'';
  const tags=(it.themes||[]).slice(0,2).map(t=>`<span class="tg">${esc(t)}</span>`).join('');
  const ent=(it.entities||[]).slice(0,2).map(e=>`<span class="tg">${esc(e)}</span>`).join('');
  return `<div class="sig" onclick="openDrawer('${it.id}')">
    <span class="lamp" style="background:${im.c}"></span>
    <span class="src">${esc(it.source)}</span>
    <span class="age">${ageLabel(hoursAgo(it.date))}</span>
    <div class="body">
      <h3>${esc(it.title)}</h3>
      <p>${esc(it.so_what||it.summary||'')}</p>
      <div class="meta">${due}${tags}${ent}</div>
    </div>
    <span class="arrow">→</span>
  </div>`;
}

function render(){
  const v=visible();
  document.getElementById('feed').innerHTML =
    v.length ? v.map(sigRow).join('') : '<div class="empty">No signals match this filter.</div>';
  const fc=document.getElementById('fcount'); if(fc) fc.textContent=`${v.length} / ${ITEMS.length}`;
  document.querySelectorAll('#filters .fchip').forEach(c=>c.classList.toggle('on',ACTIVE.has(c.textContent)));
  drawBlips(v);
  document.getElementById('scopeMeta').textContent=`${v.length} contacts`;
}

function countUp(el,to){
  const t=+to||0; if(!t){el.textContent='0';return;}
  let n=0; const step=Math.max(1,Math.round(t/18));
  const iv=setInterval(()=>{n+=step; if(n>=t){n=t;clearInterval(iv);} el.textContent=n;},26);
}

function openDrawer(id){
  const it=ITEMS.find(x=>x.id===id); if(!it)return;
  const im=IMPACT[it.impact]||IMPACT[1];
  document.getElementById('dwBody').innerHTML=`
    <button class="x" onclick="closeDrawer()">×</button>
    <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
      <span style="width:8px;height:8px;background:${im.c};display:block"></span>
      <span style="font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text-2);text-transform:uppercase">${esc(it.source)}</span>
      <span style="font-family:var(--mono);font-size:11px;color:var(--text-3)">${fmtDate(it.date)}</span>
      <span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:${im.c}">${im.n}</span>
    </div>
    <h2>${esc(it.title)}</h2>
    ${it.summary?`<div class="dsec"><div class="dl">What happened</div><p>${esc(it.summary)}</p></div>`:''}
    ${it.so_what?`<div class="dsec"><div class="dl">So what</div><p>${esc(it.so_what)}</p></div>`:''}
    ${it.action?`<div class="dsec act"><div class="dl">Action</div><p>${esc(it.action)}</p></div>`:''}
    <div class="dsec"><div class="dl">Scope</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${(it.entities||[]).map(e=>`<span class="tg">${esc(e)}</span>`).join('')}
        ${(it.themes||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join('')}
        ${it.jurisdiction?`<span class="tg">${esc(it.jurisdiction)}</span>`:''}
        ${it.deadline?`<span class="tg due">Due ${fmtDate(it.deadline)}</span>`:''}
      </div>
    </div>
    ${it.url?`<a class="dlink" href="${esc(it.url)}" target="_blank" rel="noopener">Open source ↗</a>`:''}`;
  document.getElementById('dw').classList.add('on');
  document.getElementById('ov').classList.add('on');
}
function closeDrawer(){document.getElementById('dw').classList.remove('on');document.getElementById('ov').classList.remove('on');}

function copyBrief(ev){
  const t=META.exec_summary||'';
  const b=ev&&ev.target;
  navigator.clipboard.writeText(t).then(()=>{
    if(b){const o=b.textContent;b.textContent='Copied';setTimeout(()=>b.textContent=o,1400);}
  }).catch(()=>{});
}

function openCmd(){document.getElementById('cmd').classList.add('on');document.getElementById('cmdIn').focus();cmdSearch();}
function closeCmd(){document.getElementById('cmd').classList.remove('on');document.getElementById('cmdIn').value='';}
function cmdSearch(){
  const q=document.getElementById('cmdIn').value.toLowerCase().trim(); SEL=0;
  const hits=ITEMS.filter(i=>!q||(i.title+' '+i.source+' '+(i.themes||[]).join(' ')).toLowerCase().includes(q)).slice(0,8);
  document.getElementById('cmdRes').innerHTML=hits.length
    ? hits.map((h,i)=>`<div class="${i===0?'sel':''}" onclick="closeCmd();openDrawer('${h.id}')">
        <b style="color:var(--accent)">${esc(h.source)}</b> · ${esc(h.title)}</div>`).join('')
    : '<div style="cursor:default">No match</div>';
}
function cmdKey(e){
  const rows=[...document.querySelectorAll('#cmdRes div')];
  if(e.key==='Escape')return closeCmd();
  if(e.key==='ArrowDown') SEL=Math.min(SEL+1,rows.length-1);
  else if(e.key==='ArrowUp') SEL=Math.max(SEL-1,0);
  else if(e.key==='Enter'){ rows[SEL]&&rows[SEL].click(); return; }
  else return;
  rows.forEach((r,i)=>r.classList.toggle('sel',i===SEL));
  e.preventDefault();
}
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openCmd();}
  if(e.key==='Escape'){closeDrawer();closeCmd();}
});

async function load(){
  drawScope();
  try{
    let raw = window.__EMBEDDED_ITEMS__ || await fetch('data/items.json').then(r=>r.json());
    ITEMS = Array.isArray(raw)? raw : (raw.items||[]);
    META  = window.__EMBEDDED_META__ || await fetch('data/meta.json').then(r=>r.json()).catch(()=>({}));
  }catch(e){
    document.getElementById('headline').textContent='No signal data yet.';
    document.getElementById('feed').innerHTML='<div class="empty">Run the daily watch to populate the scope.</div>';
    return;
  }
  ITEMS.sort((a,b)=>new Date(b.date)-new Date(a.date));

  const crit=ITEMS.filter(i=>i.impact===3).length;
  const imp =ITEMS.filter(i=>i.impact===2).length;
  const due =ITEMS.filter(i=>i.deadline).length;
  countUp(document.getElementById('gCrit'),crit);
  countUp(document.getElementById('gImp'),imp);
  countUp(document.getElementById('gTot'),ITEMS.length);
  countUp(document.getElementById('gDue'),due);

  document.getElementById('headline').textContent =
    crit ? `${crit} critical signal${crit>1?'s':''} in range.` : 'Nothing critical in range.';
  const lu=META.last_updated?fmtDate(META.last_updated):'—';
  document.getElementById('stamp').textContent=`Last sweep ${lu} · ${ITEMS.length} contacts · Belgium & EU`;
  document.getElementById('footStamp').textContent=`Last sweep ${lu}`;
  document.getElementById('briefText').textContent=META.exec_summary||'No briefing generated for this run.';

  pickRange(ITEMS);
  buildFilters(); render();
}
load();
</script>
</body>
</html>
