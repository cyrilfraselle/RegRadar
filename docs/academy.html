<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RegRadar Academy — Path</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="academy.css">
<script src="academy-shell.js"></script>
<style>
/* The path's home page: what I can do, what's next, and what it's
   earned me. Nothing else. */
.pad{max-width:960px;margin:0 auto;padding:34px 26px 70px}
.kick{font-size:10px;letter-spacing:.26em;color:var(--ink-3)}
h1{font-size:clamp(24px,3.6vw,40px);font-weight:700;letter-spacing:-.03em;
  line-height:1.05;margin-top:12px}
h1 em{font-style:normal;color:var(--violet)}
.lede{font-family:var(--sans);font-size:16px;line-height:1.6;color:var(--ink-2);
  margin-top:16px;max-width:62ch}

/* progress strip */
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;
  background:var(--grid);border:1px solid var(--grid);margin-top:28px}
.prog div{background:var(--console);padding:15px 14px}
.prog .n{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.prog .l{font-size:8.5px;letter-spacing:.15em;color:var(--ink-3);margin-top:7px}
.prog .rank .n{color:var(--violet);font-size:18px;letter-spacing:-.01em}
.prog .xp .n{color:var(--ink)}

/* the path */
.path{margin-top:34px;position:relative}
.path::before{content:'';position:absolute;left:23px;top:26px;bottom:26px;width:1px;
  background:var(--grid)}
.node{display:grid;grid-template-columns:48px 1fr;gap:16px;padding:11px 0;position:relative}
.mark{width:48px;display:flex;align-items:flex-start;justify-content:center;padding-top:3px}
.mark span{width:30px;height:30px;border:1px solid var(--grid);background:var(--void);
  display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink-3);
  position:relative;z-index:2;transition:all .2s var(--ease)}
.node.done .mark span{border-color:var(--phos);color:var(--phos)}
.node.now .mark span{border-color:var(--violet);color:var(--violet);
  box-shadow:0 0 0 4px rgba(110,63,191,.14)}
.node.soon .mark span{opacity:.4}
.card{border:1px solid var(--grid);padding:16px 18px;transition:all .18s var(--ease)}
.node.open .card{cursor:pointer}
.node.open .card:hover{border-color:var(--violet);transform:translateX(4px)}
.node.soon .card{opacity:.42}
.card .top{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.card .nm{font-size:17px;font-weight:700;letter-spacing:-.015em}
.card .st{font-size:8.5px;letter-spacing:.14em;padding:2px 8px;border:1px solid currentColor;
  font-weight:700}
.node.done .card .st{color:var(--phos)}
.node.now .card .st{color:var(--violet)}
.node.soon .card .st{color:var(--ink-3)}
.card .sub{font-size:11px;color:var(--ink-3);letter-spacing:.05em;margin-top:5px}
.card .tag{font-family:var(--sans);font-size:13.5px;color:var(--ink-2);line-height:1.55;
  margin-top:10px;max-width:64ch}
.card .why{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);line-height:1.5;
  margin-top:9px;border-left:2px solid var(--grid);padding-left:12px;max-width:62ch}
.card .go{margin-top:13px;display:inline-block;border:1px solid var(--violet);
  color:var(--violet);padding:9px 18px;font-size:10.5px;font-weight:700;letter-spacing:.14em;
  background:rgba(110,63,191,.06);transition:all .16s}
.card .go:hover{background:var(--violet);color:var(--void)}

.foot{margin-top:38px;border-top:1px solid var(--grid);padding-top:18px;
  display:flex;gap:20px;flex-wrap:wrap;align-items:center;
  font-size:11px;color:var(--ink-3);letter-spacing:.06em}
.foot button{border:1px solid var(--grid);color:var(--ink-3);padding:8px 14px;
  font-size:10px;letter-spacing:.12em;transition:all .16s}
.foot button:hover{border-color:var(--alarm);color:var(--alarm)}
.foot .sp{margin-left:auto}
@media(max-width:760px){.pad{padding:22px 15px 60px}.node{grid-template-columns:36px 1fr;gap:11px}
  .mark{width:36px}.path::before{left:17px}}
</style>
</head>
<body>

<div class="pad">
  <div class="kick">PATH</div>
  <h1 id="hd">Become an analyst, <em>by doing the work</em>.</h1>
  <div class="lede" id="lede">Five modules, in the order the job teaches them. Each takes fifteen
    to thirty minutes, and each produces a measurable result.</div>

  <div class="prog">
    <div class="rank"><div class="n" id="pRank">—</div><div class="l">RANK</div></div>
    <div class="xp"><div class="n" id="pXp">0</div><div class="l">TOTAL XP</div></div>
    <div><div class="n" id="pMods">0/5</div><div class="l">MODULES STARTED</div></div>
    <div><div class="n" id="pNext">—</div><div class="l">NEXT RANK</div></div>
  </div>

  <div class="path" id="path"></div>

  <div class="foot">
    <span>All data is fictional. Training environment only.</span>
    <span class="sp"></span>
    <button onclick="wipe()">Reset my progress</button>
  </div>
</div>

<script>
AcademyShell.mount('');

const S=AcademyShell;
const P=S.progress;

function paint(){
  const r=S.rank, mods=S.modules;
  const done=mods.filter(m=>(P.modules[m.id]||{}).done>0).length;
  const started=mods.filter(m=>(P.modules[m.id]||{}).started).length;

  document.getElementById('pRank').textContent=r.n;
  document.getElementById('pXp').textContent=S.xp.toLocaleString('en-US');
  document.getElementById('pMods').textContent=`${started}/${mods.length}`;
  /* The next threshold comes from the shell: duplicating the scale here
     would just guarantee the two drift apart one day. */
  const nx=[600,1500,2800,4500,6800].find(x=>x>S.xp);
  document.getElementById('pNext').textContent = nx? (nx-S.xp).toLocaleString('en-US')+' XP' : 'max rank';

  if(S.xp>0){
    document.getElementById('hd').innerHTML=`Rank reached: <em>${r.n}</em>.`;
    document.getElementById('lede').textContent=
      'The path follows the order in which the job is learned. Pick up where you left off, '
      + 'or revisit a module — the cases don’t repeat identically.';
  }

  /* The path makes visible what the tabs can't say: what's done, what's
     next, and why in this order. */
  const WHY={
   laundromat:'You can’t recognise a pattern you’ve never produced. Play the adversary first.',
   ownership:'Without knowing who actually owns a company, no alert on it makes sense.',
   desk:'The job itself: triage, investigate, and live with what each choice costs.',
   filing:'What the FIU actually receives — and the least-taught skill in the job.',
   inspection:'A supervisor goes back through your own decisions and asks why.',
  };
  let nextFound=false;
  document.getElementById('path').innerHTML=mods.map(m=>{
    const rec=P.modules[m.id]||{};
    const open=!!m.file && done>=m.needs;
    let cls, st;
    if(rec.done>0){ cls='done open'; st='DONE'; }
    else if(open && !nextFound){ cls='now open'; st='UP NEXT'; nextFound=true; }
    else if(open){ cls='open'; st='AVAILABLE'; }
    else { cls='soon'; st=m.file?'LOCKED':'IN DEVELOPMENT'; }
    const mark=rec.done>0?'✓':m.no;
    return `<div class="node ${cls}">
      <div class="mark"><span>${mark}</span></div>
      <div class="card" ${open?`onclick="location.href='${m.file}'"`:''}>
        <div class="top"><span class="nm">${m.label}</span><span class="st">${st}</span></div>
        <div class="sub">MODULE ${m.no}${rec.done?` · ${rec.done} completed`:''}</div>
        <div class="tag">${m.tag}</div>
        <div class="why">${WHY[m.id]||''}</div>
        ${open?`<span class="go">${rec.done?'RESUME':'START'} →</span>`:''}
      </div></div>`;
  }).join('');
}

function wipe(){
  if(confirm('Clear all progress saved in this browser?')) S.reset();
}
paint();
</script>
</body>
</html>
