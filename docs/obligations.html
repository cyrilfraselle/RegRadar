<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<script>
(function(){try{var t=localStorage.getItem('regradar-theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RegRadar — Obligations</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="regradar.css">
<style>
  :root {
    --bg:#0E1117; --surface:#151A21; --surface-2:#1A2029; --border:#232B36; --border-strong:#2E3845;
    --text:#E6EDF3; --text-2:#9AA7B4; --text-3:#5E6B79; --accent:#4D8DFF; --accent-bg:#14213D;
    --crit:#F0616D; --crit-bg:#2A1518; --imp:#E3A008; --imp-bg:#2A2008; --info:#5DA9E9; --ok:#2EBD85; --ok-bg:#0F2018; --purple:#9D7BD8;
    --radius:10px; --radius-sm:6px;
    --font:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",system-ui,sans-serif; --mono:'SF Mono',ui-monospace,Menlo,monospace;
  }
  html[data-theme="light"] {
    --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#F8FAFC; --border:#E6E9EF; --border-strong:#D5DAE2;
    --text:#16202C; --text-2:#5A6675; --text-3:#94A0AE; --accent:#0039A6; --accent-bg:#E7EDFB;
    --crit:#C13515; --crit-bg:#FCEEE9; --imp:#B25E09; --imp-bg:#FBF1E2; --info:#1E6FB8; --ok:#0F8A5F; --ok-bg:#E7F5EE; --purple:#6B2D8B;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--font); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 20px; }


  .head { padding:26px 0 6px; }
  .head h1 { font-size:22px; font-weight:700; }
  .head .sub { color:var(--text-2); font-size:14px; margin-top:4px; }

  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:20px 0; }
  .stat { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px 15px; }
  .stat .n { font-size:24px; font-weight:700; font-family:var(--mono); }
  .stat .l { font-size:11px; color:var(--text-3); margin-top:4px; }

  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .search { flex:1; min-width:200px; padding:9px 12px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); font-size:13px; outline:none; }
  .search:focus { border-color:var(--accent); }
  .sel { padding:9px 11px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); font-size:13px; cursor:pointer; }

  .filters { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; align-items:center; }
  .filter-label { font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:.05em; }
  .chip { font-size:12px; padding:5px 11px; border-radius:20px; border:1px solid var(--border); background:var(--surface); color:var(--text-2); cursor:pointer; font-weight:500; }
  .chip:hover { border-color:var(--border-strong); color:var(--text); }
  .chip.on { background:var(--accent-bg); border-color:var(--accent); color:var(--accent); }
  .filter-sep { width:1px; height:18px; background:var(--border); margin:0 4px; }

  .ob-list { display:flex; flex-direction:column; gap:10px; padding-bottom:60px; }
  .ob { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:15px 17px; display:grid; grid-template-columns:1fr auto; gap:12px; align-items:start; }
  .ob.imminent { border-left:3px solid var(--crit); }
  .ob.upcoming { border-left:3px solid var(--imp); }
  .ob.scheduled { border-left:3px solid var(--info); }
  .ob.ongoing { border-left:3px solid var(--text-3); }
  .ob.passed { opacity:.55; border-left:3px solid var(--text-3); }
  .ob-main { min-width:0; }
  .ob-what { font-size:14px; font-weight:600; line-height:1.4; margin-bottom:8px; }
  .ob-who { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:8px; }
  .ent-pill { font-size:10px; padding:2px 8px; border-radius:4px; background:var(--surface-2); color:var(--text-2); border:1px solid var(--border); }
  .ob-meta { display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--text-3); align-items:center; }
  .ob-basis { color:var(--purple); }
  .ob-topic { color:var(--text-2); }
  .ob-src { color:var(--accent); cursor:pointer; }
  .ob-src:hover { text-decoration:underline; }
  .ob-right { text-align:right; white-space:nowrap; }
  .ob-deadline { font-family:var(--mono); font-size:13px; font-weight:600; }
  .dl-imminent { color:var(--crit); } .dl-upcoming { color:var(--imp); } .dl-scheduled { color:var(--info); } .dl-ongoing { color:var(--text-3); } .dl-passed { color:var(--text-3); }
  .ob-status { font-size:10px; text-transform:uppercase; letter-spacing:.05em; margin-top:3px; padding:2px 7px; border-radius:10px; display:inline-block; }
  .st-imminent { background:var(--crit-bg); color:var(--crit); } .st-upcoming { background:var(--imp-bg); color:var(--imp); } .st-scheduled { background:var(--info); color:#fff; opacity:.85; } .st-ongoing { background:var(--surface-2); color:var(--text-3); } .st-passed { background:var(--surface-2); color:var(--text-3); }
  .prio-dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:3px; }
  .prio-high { background:var(--crit); } .prio-medium { background:var(--imp); }
  .empty { text-align:center; padding:40px; color:var(--text-3); }
  .export-btn { font-size:12px; padding:8px 13px; border-radius:var(--radius-sm); border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text); cursor:pointer; }
  .export-btn:hover { border-color:var(--accent); color:var(--accent); }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--border-strong); border-radius:8px; padding:10px 16px; font-size:13px; display:none; z-index:100; }

.ob-detail{margin-top:10px;padding-top:12px;border-top:1px solid var(--border)}
.ob-verbatim{font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:10px}
.ob-subreq{font-size:12.5px;color:var(--text-2);margin:0 0 10px 18px;line-height:1.7}
.ob-cases{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.ob-cases .lbl{font-size:11px;color:var(--text-3);margin-right:2px}
.case-pill{font-size:10.5px;padding:2px 8px;border-radius:4px;background:var(--accent-bg);color:var(--accent);border:1px solid var(--border);font-family:var(--mono)}
.ob-note{font-size:12px;color:var(--text-3);font-style:italic;margin-bottom:8px}
.ob-expand{font-size:11.5px;color:var(--accent);cursor:pointer;margin-top:6px;display:inline-block}
.ob-expand:hover{text-decoration:underline}
.disclaimer{font-size:11px;color:var(--text-3);text-align:center;margin:24px 0 40px;line-height:1.6}

/* ── profile / personalization ── */
.profile-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px;padding:11px 14px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm)}
.profile-row .lbl{font-size:12px;color:var(--text-3)}
.who-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--accent);
  background:var(--accent-bg);border:1px solid var(--accent);border-radius:20px;padding:4px 11px 4px 8px;cursor:pointer}
.who-pill:hover{opacity:.85}
.pick-ent{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--text-2);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.pick-ent:hover{border-color:var(--accent);color:var(--accent)}
.myreg-toggle{margin-left:auto;font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.myreg-toggle input{accent-color:var(--accent)}
.reg-note{font-size:12px;color:var(--imp);background:var(--imp-bg);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:9px 12px;margin:0 0 14px}

.ent-pill.mine{background:var(--accent-bg);color:var(--accent);border-color:var(--accent);font-weight:700}
.ob.dismissed{opacity:.5}
.ob.pinned{border-left:3px solid var(--purple)}
.ob-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ob-act{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--text-2);cursor:pointer}
.ob-act:hover{border-color:var(--border-strong);color:var(--text)}
.ob-act.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.ob-act.warn.on{background:var(--crit-bg);border-color:var(--crit);color:var(--crit)}
.ob-note-box{margin-top:8px}
.ob-note-box textarea{width:100%;min-height:52px;padding:8px 10px;font-size:12.5px;font-family:inherit;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);resize:vertical}
.ob-note-view{font-size:12.5px;color:var(--text);background:var(--ok-bg);border-left:2px solid var(--ok);
  padding:7px 10px;margin-top:8px;border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.ob-note-view b{color:var(--ok);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:2px}
.dismiss-note{font-size:12px;color:var(--text-3);margin-top:6px}

/* ── mapped controls, inside the detail expansion ── */
.ob-controls{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.ob-controls .lbl{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);margin-bottom:7px;display:block}
.ctl-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:20px;padding:5px 11px;margin:0 6px 6px 0}
.ctl-pill .st{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.ctl-pill .st.pending_review{background:var(--imp)} .ctl-pill .st.draft{background:var(--text-3)}
.no-ctl{font-size:12px;color:var(--crit);margin-bottom:8px}
.map-open{font-size:11.5px;color:var(--accent);cursor:pointer}
.map-open:hover{text-decoration:underline}
.map-picker{margin-top:8px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm)}
.map-picker .none{font-size:12px;color:var(--text-3)}
.map-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}
.map-row:last-child{border-bottom:none}
.map-row .n{font-size:12.5px}
.map-row .n small{display:block;font-size:11px;color:var(--text-3);margin-top:1px}
.link-btn{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent);
  border-radius:14px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.link-btn:hover{opacity:.85}
</style>
</head>
<body>
<script src="site-nav.js"></script>

<div class="wrap">
  <div class="head">
    <h1>Obligations register</h1>
    <p class="sub">Who must do what, by when — mapped article by article from the actual regulatory text, not a summary of it.</p>
  </div>

  <div class="stats" id="stats"></div>
  <div class="profile-row" id="profileRow"></div>
  <div id="regNote"></div>

  <div class="toolbar">
    <input class="search" id="search" placeholder="Search obligations…" oninput="render()">
    <select class="sel" id="sortBy" onchange="render()">
      <option value="deadline">Sort: by deadline</option>
      <option value="priority">Sort: by priority</option>
      <option value="detected">Sort: recently detected</option>
    </select>
    <button class="export-btn" onclick="exportCsv()">⬇ Export CSV</button>
  </div>

  <div class="filters" id="filters"></div>
  <div class="ob-list" id="list"><div class="empty">Loading obligations…</div></div>
  <p class="disclaimer">Indicative compliance register, not legal advice. Always verify against the current text and any Belgian transposition or supervisory guidance.</p>
</div>

<div class="toast" id="toast"></div>

<script src="controls-data.js"></script>
<script>
let OBS=[], META=null, APP=null, ENTITY_LABEL={}, filters={status:null, entity:null, topic:null, priority:null}, openId=null;
let CONTROLS=[], mapPickerId=null;
const STATUS_ORDER={imminent:0,upcoming:1,scheduled:2,ongoing:3,passed:4};

/* ── shared profile: same localStorage key regwatch.html's "What
   applies to me" writes to, so setting it once personalizes both
   pages. Not owned by this page — read/write in the same shape. ── */
const PKEY='regradar-profile';
let ENTITY='', ACTS=new Set();
function loadProfile(){
  try{ const p=JSON.parse(localStorage.getItem(PKEY)||'null');
    if(p){ ENTITY=p.entity||''; ACTS=new Set(p.acts||[]); } }catch(e){}
}
function saveProfile(){ try{ localStorage.setItem(PKEY,JSON.stringify({entity:ENTITY,acts:[...ACTS]})); }catch(e){} }

/* ── this page's own workspace: dismissed/pinned/notes, per obligation
   id. Device-local only, same as the rest of the site's personalization. ── */
const MYKEY='regradar-obligations-mine';
let MINE={dismissed:{}, pinned:[], notes:{}};
function loadMine(){
  try{ const m=JSON.parse(localStorage.getItem(MYKEY)||'null'); if(m) MINE={...MINE, ...m}; }catch(e){}
}
function saveMine(){ try{ localStorage.setItem(MYKEY,JSON.stringify(MINE)); }catch(e){} }

let myRegOnly=true, pickerOpen=false;

/* Same applicability logic as regwatch.html's "What applies to me" —
   kept here rather than shared, it's nine lines. */
function verdictFor(reg,entity,acts){
  let s = reg.applies[entity] || 'na';
  const raises = reg.activity_raises || {};
  for(const a of acts){
    const t = raises[a];
    if(t && t.includes(entity)) s = s==='na' ? 'conditional' : 'direct';
  }
  return s;
}
function regOf(o){
  if(!APP) return null;
  const name=(o.legal_basis||'').split(' ')[0];
  return APP.regulations.find(r=>r.name===name) || null;
}
function verdictOf(o){
  if(!ENTITY) return null;
  const reg=regOf(o); if(!reg) return null;
  return verdictFor(reg, ENTITY, ACTS);
}

async function load(){
  try{
    const [obData, appData, cd] = await Promise.all([
      window.__EMBEDDED_OBLIGATIONS__ ? Promise.resolve({obligations:window.__EMBEDDED_OBLIGATIONS__}) : fetch('data/obligations.json',{cache:'no-store'}).then(r=>r.json()),
      fetch('data/applicability.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
      ControlsData.load().catch(()=>({controls:[]})),
    ]);
    OBS = obData.obligations || obData;
    META = obData._meta || null;
    APP = appData;
    CONTROLS = cd.controls || [];
    if(appData) (appData.entities||[]).forEach(e=>ENTITY_LABEL[e.id]={label:e.label, icon:e.icon});
    loadProfile(); loadMine();
    renderMeta(); renderProfileRow(); renderStats(); buildFilters(); render();
  }catch(e){
    document.getElementById('list').innerHTML='<div class="empty">No obligations yet. Run the engine to extract them.</div>';
  }
}

function entityLabel(id){ return (ENTITY_LABEL[id]||{}).label || id; }
function entityIcon(id){ return (ENTITY_LABEL[id]||{}).icon || ''; }

/* ── profile row: pick/change entity, and the regulation-level
   conditional/n.a. banner once a profile is set ── */
function renderProfileRow(){
  const el=document.getElementById('profileRow');
  if(!ENTITY){
    el.innerHTML = `<span class="lbl">Personalize this register —</span>
      ${(APP&&APP.entities||[]).map(e=>`<button class="pick-ent" data-e="${esc(e.id)}">${e.icon} ${esc(e.label)}</button>`).join('')}`;
    el.querySelectorAll('[data-e]').forEach(b=>b.addEventListener('click',()=>{
      ENTITY=b.dataset.e; saveProfile(); myRegOnly=true;
      renderProfileRow(); renderRegNote(); renderStats(); render();
    }));
  } else {
    el.innerHTML = `<span class="lbl">Personalized for</span>
      <span class="who-pill" id="whoPill">${entityIcon(ENTITY)} ${esc(entityLabel(ENTITY))} · change</span>
      <label class="myreg-toggle"><input type="checkbox" id="myRegChk" ${myRegOnly?'checked':''}> My register only</label>`;
    document.getElementById('whoPill').addEventListener('click',()=>{ ENTITY=''; ACTS.clear(); saveProfile();
      renderProfileRow(); renderRegNote(); renderStats(); render(); });
    document.getElementById('myRegChk').addEventListener('change',e=>{ myRegOnly=e.target.checked; render(); });
  }
  renderRegNote();
}
function renderRegNote(){
  const el=document.getElementById('regNote');
  if(!ENTITY || !APP){ el.innerHTML=''; return; }
  const regs=[...new Set(OBS.map(regOf).filter(Boolean))];
  const notes=[];
  regs.forEach(reg=>{
    const v=verdictFor(reg,ENTITY,ACTS);
    if(v==='na') notes.push(`${reg.name} does not apply to ${entityLabel(ENTITY)} — ${esc(reg.why||'')}`);
    else if(v==='conditional') notes.push(`${reg.name} applies to ${entityLabel(ENTITY)} conditionally — ${esc((reg.notes||{})[ENTITY]||reg.why||'')}`);
  });
  el.innerHTML = notes.map(n=>`<div class="reg-note">${n}</div>`).join('');
}

function renderMeta(){
  if(!META) return;
  const el=document.querySelector('.head .sub');
  if(el) el.textContent = `${META.scope||''}`.trim() || el.textContent;
}

function fmtDate(iso){ if(!iso) return 'ongoing'; return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function daysAway(iso){ if(!iso) return null; return Math.round((new Date(iso)-Date.now())/864e5); }

function renderStats(){
  const imminent=OBS.filter(o=>o.status==='imminent').length;
  const upcoming=OBS.filter(o=>o.status==='upcoming').length;
  const high=OBS.filter(o=>o.priority==='high').length;
  const cards=[['Total',OBS.length,'var(--accent)'],['Imminent (≤30d)',imminent,'var(--crit)'],['Upcoming (≤90d)',upcoming,'var(--imp)'],['High priority',high,'var(--purple)']];
  document.getElementById('stats').innerHTML=cards.map(([l,n,c])=>`<div class="stat"><div class="n" style="color:${c}">${n}</div><div class="l">${l}</div></div>`).join('');
}

function buildFilters(){
  const entities=[...new Set(OBS.flatMap(o=>o.who||[]))];
  const topics=[...new Set(OBS.map(o=>o.topic).filter(Boolean))];
  let h='<span class="filter-label">Status</span>';
  [['imminent','Imminent'],['upcoming','Upcoming'],['scheduled','Scheduled'],['ongoing','Ongoing']].forEach(([v,l])=>h+=chip('status',v,l));
  h+='<span class="filter-sep"></span><span class="filter-label">Priority</span>';
  [['high','High'],['medium','Medium']].forEach(([v,l])=>h+=chip('priority',v,l));
  h+='<span class="filter-sep"></span><span class="filter-label">Impacted</span>';
  entities.forEach(e=>h+=chip('entity',e,entityLabel(e)));
  h+='<span class="filter-sep"></span><span class="filter-label">Topic</span>';
  topics.forEach(t=>h+=chip('topic',t,t));
  document.getElementById('filters').innerHTML=h;
}
function chip(type,val,label){ const on=String(filters[type])===String(val)?'on':''; return `<span class="chip ${on}" onclick="toggleFilter('${type}','${String(val).replace(/'/g,"\\'")}')">${esc(label)}</span>`; }
function toggleFilter(type,val){ filters[type]=String(filters[type])===String(val)?null:val; buildFilters(); render(); }

function getFiltered(){
  let list=[...OBS];
  const q=document.getElementById('search').value.toLowerCase().trim();
  if(q) list=list.filter(o=>(o.what+' '+o.legal_basis+' '+(o.who||[]).map(entityLabel).join(' ')+' '+o.topic+' '+(o.verbatim||'')).toLowerCase().includes(q));
  if(filters.status) list=list.filter(o=>o.status===filters.status);
  if(filters.priority) list=list.filter(o=>o.priority===filters.priority);
  if(filters.entity) list=list.filter(o=>(o.who||[]).includes(filters.entity));
  if(filters.topic) list=list.filter(o=>o.topic===filters.topic);
  if(myRegOnly){
    list=list.filter(o=>!MINE.dismissed[o.id]);
    if(ENTITY) list=list.filter(o=>verdictOf(o)!=='na');
  }
  const sort=document.getElementById('sortBy').value;
  if(sort==='deadline') list.sort((a,b)=> (STATUS_ORDER[a.status]-STATUS_ORDER[b.status]) || ((a.deadline||'9999')<(b.deadline||'9999')?-1:1));
  else if(sort==='priority') list.sort((a,b)=> (a.priority==='high'?0:1)-(b.priority==='high'?0:1));
  else list.sort((a,b)=> (b.detected||'').localeCompare(a.detected||''));
  list.sort((a,b)=> (MINE.pinned.includes(b.id)?1:0)-(MINE.pinned.includes(a.id)?1:0));
  return list;
}

let editingNote=null;

function render(){
  const list=getFiltered();
  if(!list.length){
    const msg = myRegOnly && OBS.length ? 'Nothing in your register yet — turn off "My register only" to see everything, or your profile marks all obligations as not applicable.' : 'No obligations match these filters.';
    document.getElementById('list').innerHTML=`<div class="empty">${msg}</div>`; return;
  }
  document.getElementById('list').innerHTML=list.map(o=>{
    const da=daysAway(o.deadline);
    const dlText = o.deadline ? (da<0?`${Math.abs(da)}d ago`:`applies in ${da}d`) : 'ongoing';
    const who=(o.who||[]).map(w=>`<span class="ent-pill ${w===ENTITY?'mine':''}">${esc(entityLabel(w))}</span>`).join('');
    const hasDetail = true; // every obligation now also shows its (possibly empty) mapped-controls section
    const dismissed = !!MINE.dismissed[o.id];
    const pinned = MINE.pinned.includes(o.id);
    const note = MINE.notes[o.id];
    return `<div class="ob ${o.status} ${dismissed?'dismissed':''} ${pinned?'pinned':''}" data-id="${esc(o.id)}">
      <div class="ob-main">
        <div class="ob-what"><span class="prio-dot prio-${o.priority}"></span>${esc(o.what)}</div>
        <div class="ob-who">${who}</div>
        ${o.who_note?`<div class="ob-note">${esc(o.who_note)}</div>`:''}
        <div class="ob-meta">
          <span class="ob-basis">§ ${esc(o.legal_basis||'—')}</span>
          <span class="ob-topic">${esc(o.topic||'')}</span>
          ${o.source_url?`<span class="ob-src" onclick="window.open('${o.source_url}','_blank')">read the article ↗</span>`:''}
          ${hasDetail?`<span class="ob-expand" onclick="toggleDetail('${esc(o.id)}')">${openId===o.id?'hide detail ▲':'show detail ▼'}</span>`:''}
        </div>
        ${openId===o.id?renderDetail(o):''}
        <div class="ob-actions">
          <button class="ob-act ${pinned?'on':''}" onclick="togglePin('${esc(o.id)}')">${pinned?'★ Watching':'☆ Watch'}</button>
          <button class="ob-act warn ${dismissed?'on':''}" onclick="toggleDismiss('${esc(o.id)}')">${dismissed?'↺ Restore':'✕ Not applicable to us'}</button>
          <button class="ob-act" onclick="toggleNoteEdit('${esc(o.id)}')">✎ ${note?'Edit note':'Add note'}</button>
        </div>
        ${editingNote===o.id?`<div class="ob-note-box">
            <textarea id="noteInput">${esc(note||'')}</textarea>
            <div class="ob-actions"><button class="ob-act on" onclick="saveNote('${esc(o.id)}')">Save</button>
              <button class="ob-act" onclick="editingNote=null;render()">Cancel</button></div>
          </div>`
          : note?`<div class="ob-note-view"><b>Your note</b>${esc(note)}</div>`:''}
      </div>
      <div class="ob-right">
        <div class="ob-deadline dl-${o.status}">${fmtDate(o.deadline)}</div>
        <div style="font-size:11px;color:var(--text-3);margin-top:2px">${dlText}</div>
        <span class="ob-status st-${o.status}">${o.status}</span>
      </div>
    </div>`;
  }).join('');
}

function togglePin(id){
  const i=MINE.pinned.indexOf(id);
  if(i>=0) MINE.pinned.splice(i,1); else MINE.pinned.push(id);
  saveMine(); render();
}
function toggleDismiss(id){
  if(MINE.dismissed[id]) delete MINE.dismissed[id]; else MINE.dismissed[id]=true;
  saveMine(); render(); renderStats();
}
function toggleNoteEdit(id){ editingNote = editingNote===id ? null : id; render();
  if(editingNote){ const ta=document.getElementById('noteInput'); if(ta) ta.focus(); } }
function saveNote(id){
  const ta=document.getElementById('noteInput');
  const v=(ta?ta.value:'').trim();
  if(v) MINE.notes[id]=v; else delete MINE.notes[id];
  saveMine(); editingNote=null; render();
}

function renderDetail(o){
  const subs=(o.sub_requirements||[]).map(s=>`<li>${esc(s)}</li>`).join('');
  const cases=(o.academy_cases||[]).map(c=>`<span class="case-pill">${esc(c)}</span>`).join('');
  return `<div class="ob-detail on">
    ${o.verbatim?`<div class="ob-verbatim">“${esc(o.verbatim)}”</div>`:''}
    ${subs?`<ul class="ob-subreq">${subs}</ul>`:''}
    ${cases?`<div class="ob-cases"><span class="lbl">Trained in Academy:</span>${cases}</div>`:''}
    ${renderControls(o)}
  </div>`;
}

function controlsFor(id){ return CONTROLS.filter(c=>(c.obligation_ids||[]).includes(id)); }

function renderControls(o){
  const mapped = controlsFor(o.id);
  const pills = mapped.map(c=>`<span class="ctl-pill"><span class="st ${c.status}"></span>${esc(c.name)}</span>`).join('');
  return `<div class="ob-controls">
    <span class="lbl">Mapped controls</span>
    ${mapped.length ? pills : '<div class="no-ctl">No control covers this obligation yet — it’s a gap.</div>'}
    <div><span class="map-open" onclick="toggleMapPicker('${esc(o.id)}')">${mapPickerId===o.id?'cancel':'+ Map a control'}</span></div>
    ${mapPickerId===o.id?renderMapPicker(o):''}
  </div>`;
}

function renderMapPicker(o){
  const already=new Set(controlsFor(o.id).map(c=>c.id));
  const candidates=CONTROLS.filter(c=>!already.has(c.id));
  if(!candidates.length) return `<div class="map-picker"><div class="none">Every control in your library is already linked here — add a new one on the <a href="controls.html" style="color:var(--accent)">Controls library</a> page.</div></div>`;
  const rows=candidates.map(c=>`<div class="map-row">
      <div class="n">${esc(c.name)}<small>${esc(c.owner)} · ${esc(c.frequency)}</small></div>
      <button class="link-btn" onclick="linkControl('${esc(o.id)}','${esc(c.id)}')">Link</button>
    </div>`).join('');
  return `<div class="map-picker">${rows}</div>`;
}

function toggleMapPicker(id){ mapPickerId = mapPickerId===id ? null : id; render(); }
function linkControl(obId,ctlId){
  ControlsData.mapControl(obId,ctlId);
  const c=CONTROLS.find(c=>c.id===ctlId);
  if(c && !(c.obligation_ids||[]).includes(obId)) c.obligation_ids=(c.obligation_ids||[]).concat([obId]);
  mapPickerId=null; render();
  showToast('Control linked');
}

function toggleDetail(id){ openId = openId===id ? null : id; render(); }

function exportCsv(){
  const list=getFiltered();
  const rows=[['Who','What','Deadline','Status','Legal basis','Topic','Priority','Source']];
  list.forEach(o=>rows.push([(o.who||[]).map(entityLabel).join('; '),o.what,o.deadline||'ongoing',o.status,o.legal_basis||'',o.topic||'',o.priority,o.source_url||'']));
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='regradar_obligations.csv'; a.click();
  showToast('CSV exported');
}

let toastT;
function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display='none',1600); }
function toggleTheme(){ const h=document.documentElement; const t=h.dataset.theme==='dark'?'light':'dark'; h.dataset.theme=t; try{localStorage.setItem('regradar-theme',t);}catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

load();
</script>
